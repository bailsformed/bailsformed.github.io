<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The Family Village</title>
<meta name="theme-color" content="#2b2240">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Village">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2f4a;--ink2:#6b5a7a;--paper:#fffaf0;--muted:#e9dcc6;--pink:#f29bb5;--gold:#f6c453;--purple:#8a6fd1;--night:#2b2240;--good:#4caf7a;--bad:#e0566f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px;
  background:radial-gradient(circle at 20% 10%,#3d3057 0,transparent 40%),radial-gradient(circle at 80% 90%,#3a2d52 0,transparent 40%),var(--night);background-attachment:fixed}
.px{font-family:"Pixelify Sans",monospace}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:14px 12px 110px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:4px;box-shadow:0 4px 0 #1d1629,inset 0 -4px 0 var(--muted)}
.pad{padding:14px}
.stack>*+*{margin-top:12px}
h1,h2,h3{margin:0}
.title{color:#fff3dc;font-size:20px;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
.title small{font-family:Nunito;font-size:13px;color:#b9aacc;font-weight:600;margin-left:auto}
.muted{color:var(--ink2)}
.tiny{font-size:12px}
.center{text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:3px solid var(--ink);background:var(--gold);border-radius:4px;padding:9px 14px;font-weight:800;box-shadow:0 3px 0 var(--ink);transition:transform .05s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink)}.btn.purple{background:var(--purple);color:#fff}.btn.plain{background:#fff}
.btn.big{font-size:18px;padding:14px 18px;width:100%}
.btn:disabled{opacity:.5}
[aria-busy=true]{opacity:.6;cursor:progress}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:"Pixelify Sans",monospace;font-size:13px;border:2px solid var(--ink);border-radius:3px;padding:2px 8px;background:#ffe7a6}
.chip.on{background:var(--pink)}
button.chip{box-shadow:0 2px 0 var(--ink)}
input[type=text],input[type=number],input[type=password],input:not([type]),textarea,select{width:100%;border:3px solid var(--ink);border-radius:4px;padding:10px;background:#fff}
textarea{resize:vertical;min-height:70px}
label.lbl{display:block;font-weight:800;margin:10px 0 4px}
.err{color:var(--bad);font-weight:800;min-height:1.2em}
/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.top h1{font-size:22px;min-width:0}
.me-btn{margin-left:6px;border:3px solid var(--ink);border-radius:50%;width:46px;height:46px;font-size:24px;background:#fff;display:grid;place-items:center;flex:none}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:3px solid var(--ink);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;font-family:"Pixelify Sans";font-size:11px;padding:4px 6px;border-radius:6px;min-width:52px;position:relative}
nav.tabs button span{font-size:24px;line-height:1.1}
nav.tabs button.on{background:#ffe7a6}
.dot{position:absolute;top:2px;right:8px;background:var(--bad);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;font-family:Nunito;font-weight:800}
/* street */
.street{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.house{position:relative;text-align:center;padding:10px 6px 8px;background:#fff;border:3px solid var(--ink);border-radius:4px;box-shadow:0 3px 0 #1d1629}
.house .roof{position:absolute;left:-3px;right:-3px;top:-14px;height:14px;background:var(--hc,#c96);clip-path:polygon(0 100%,50% 0,100% 100%);}
.house .av{font-size:34px}
.house .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.house .lantern{position:absolute;top:4px;right:6px;font-size:16px;filter:grayscale(1);opacity:.35}
.house .lantern.lit{filter:none;opacity:1;text-shadow:0 0 8px #ffcf4d}
.house .badges{font-size:12px;color:var(--ink2);min-height:16px}
.scholar-tag{font-size:11px;background:#e8e0ff;border:2px solid var(--ink);border-radius:3px;padding:0 4px;font-family:"Pixelify Sans"}
/* feed */
.post{padding:12px}
.post .head{display:flex;align-items:center;gap:8px}
.post .av{font-size:26px;width:38px;height:38px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:#fff;flex:none}
.post .who{font-weight:800}
.post .when{font-size:12px;color:var(--ink2)}
.post .body{margin:8px 0 6px;font-size:17px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.post .kind{margin-left:auto}
.villager{font-size:13px;color:var(--ink2);font-style:italic;margin:2px 0 6px}
.emojis{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.emojis button{border:2px solid var(--ink);background:#fff;border-radius:16px;padding:2px 9px;font-size:14px}
.emojis button.mine{background:#ffe7a6}
.comments{border-top:2px dashed var(--muted);margin-top:8px;padding-top:6px}
.cmt{display:flex;gap:8px;padding:6px 0;align-items:flex-start}
.cmt .av{width:28px;height:28px;font-size:18px}
.cmt .txt{flex:1;min-width:0}
.cmt .txt b{font-size:14px}
.cmt img,.kmsg img{max-width:160px;max-height:160px;border:2px solid var(--ink);border-radius:4px;display:block;margin-top:4px}
.more{background:none;border:0;font-size:18px;color:var(--ink2);padding:0 4px}
.composer{display:flex;gap:6px;margin-top:6px;align-items:center}
.composer input{padding:8px}
.iconbtn{border:2px solid var(--ink);background:#fff;border-radius:4px;padding:6px 8px;font-size:16px;flex:none}
.iconbtn.on{background:#ffd27a}
.pickedimg{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:4px}
.pickedimg img{width:40px;height:40px;object-fit:cover;border:2px solid var(--ink);border-radius:3px}
/* memes */
.memegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.meme{border:3px solid var(--ink);border-radius:4px;background:#fff;padding:0;overflow:hidden;text-align:center}
.meme img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.meme .cap{font-size:12px;font-weight:800;padding:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flowerimg{width:100%;aspect-ratio:1;display:grid;place-items:center;font-size:44px;background:#fdeef3}
/* quotes */
.quote{padding:16px 16px 12px;position:relative}
.quote .q{font-size:20px;font-weight:800;line-height:1.35}
.quote .q:before{content:"“";font-size:40px;line-height:0;vertical-align:-14px;color:var(--pink);margin-right:2px}
.quote .by{margin-top:6px;font-family:"Pixelify Sans";font-size:15px}
.quote .ctx{font-size:13px;color:var(--ink2)}
/* kitchen */
.kitchen{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow-y:auto;padding:10px}
.kmsg{display:flex;gap:6px;align-items:flex-end;max-width:85%}
.kmsg .bub{background:#fff;border:2px solid var(--ink);border-radius:12px 12px 12px 2px;padding:6px 10px;white-space:pre-wrap;word-wrap:break-word}
.kmsg.mine{align-self:flex-end;flex-direction:row-reverse}
.kmsg.mine .bub{background:#ffe7a6;border-radius:12px 12px 2px 12px}
.kmsg .nm{font-size:11px;color:var(--ink2);font-weight:800}
/* trivia */
.choice{display:block;width:100%;text-align:left;margin-top:8px;border:3px solid var(--ink);border-radius:4px;background:#fff;padding:12px;font-size:17px;font-weight:700;box-shadow:0 3px 0 var(--ink)}
.choice.right{background:#c9f0d6}.choice.wrong{background:#ffd0d8}
.big-q{font-size:20px;font-weight:800;line-height:1.35}
/* awards */
.award{padding:12px}
.award .ah{display:flex;gap:8px;align-items:center;font-weight:800;font-size:17px}
.award .ah .em{font-size:26px}
.rank{display:flex;gap:6px;align-items:center;font-size:15px;padding:2px 0}
.trophies{font-size:20px;letter-spacing:2px}
.banner{background:#ffe7a6;border:3px solid var(--ink);border-radius:4px;padding:10px 12px;font-weight:800;box-shadow:0 3px 0 #1d1629}
.banner.love{background:#ffd9e5}
/* modal */
.modal-bg{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:680px;max-height:88vh;overflow-y:auto;border-radius:8px 8px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:6px}}
.x{float:right;background:none;border:0;font-size:26px;line-height:1}
.avgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.avgrid button{font-size:24px;border:2px solid transparent;background:none;border-radius:6px;padding:2px}
.avgrid button.on{border-color:var(--ink);background:#ffe7a6}
.avgrid button:disabled{opacity:.2;filter:grayscale(1);cursor:not-allowed}
.house .tags{font-size:13px;min-height:16px}
.scholar-tag{margin:2px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;z-index:60;font-weight:800;max-width:90vw;text-align:center}
.me-btn.love{font-size:20px}
@media(max-width:420px){.top h1{font-size:18px}.me-btn{margin-left:4px}}
/* phones: comfortable ~44px tap targets */
@media(max-width:699px),(pointer:coarse){
  .emojis{gap:8px}
  .emojis button{min-height:44px;min-width:44px;padding:4px 12px;font-size:16px}
  button.chip{min-height:44px;padding:4px 12px;font-size:14px}
  .more{min-width:44px;min-height:44px;font-size:22px}
}
.loading{color:#fff3dc;text-align:center;padding:60px 20px;font-family:"Pixelify Sans";font-size:20px}
.hidden{display:none!important}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:70;pointer-events:none;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.pinbox{letter-spacing:12px;font-size:28px;text-align:center;font-family:"Pixelify Sans"}
.honeychoice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.honeychoice button{padding:14px 8px;font-weight:800;border:3px solid var(--ink);border-radius:4px;background:#fff;box-shadow:0 3px 0 var(--ink)}
.honeychoice button.on{background:var(--gold)}
table.lb{width:100%;border-collapse:collapse;font-size:15px}
table.lb td{padding:4px 2px;border-bottom:1px dashed var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.tile{border:2px solid var(--ink);border-radius:4px;background:#fff;padding:8px 4px;text-align:center}
.tile .tv{font-family:"Pixelify Sans";font-size:26px;line-height:1}
.tile .tl{font-size:11px;color:var(--ink2);margin-top:2px}
.stat-h{margin:16px 0 6px;font-size:16px}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--muted);padding-top:4px}
.bars.short{height:80px}
.bars .bar{flex:1;min-width:0;border:0;padding:0;background:var(--purple);border-radius:4px 4px 0 0;cursor:pointer;opacity:.85}
.bars .bar:hover,.bars .bar.sel{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-top:2px}
.readout{min-height:1.3em;margin:4px 0 0}
.hrow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.hrow .hl{width:96px;flex:none}
.hrow .htrack{flex:1;height:12px;background:#f1e9da;border-radius:0 4px 4px 0}
.hrow .hfill{display:block;height:100%;background:var(--purple);border-radius:0 4px 4px 0}
.hrow .hv{width:34px;text-align:right;color:var(--ink2);flex:none}
.me-btn.help{margin-left:auto;font-size:20px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dots span.on{background:var(--ink)}
.sass{font-size:14px;font-style:italic;color:var(--ink2);margin-top:6px;line-height:1.35}
.gsec{margin:8px 0;font-size:15px;line-height:1.4}
.gsec b{display:block}
.hv-banner{background:#ffd9e5}
</style>
</head>
<body>
<div id="app"><div class="loading">🏡 opening the village gates…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="village.js"></script>
<script data-goatcounter="https://bailsformed.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
