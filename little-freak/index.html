<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#140c18">
<title>Unmarketable Little Freak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Pixelify+Sans:wght@500;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* Gothic archive + craft-room glitter explosion. One look, dark on purpose. */
:root{
  --bg:#140c18; --stone:#1e1424; --panel:#271a30; --panel2:#30203b; --edge:#4e3260;
  --ink:#f5e9f7; --dim:#bfa6cc; --pink:#ff5fa2; --gold:#f4c95d; --teal:#5ee0d0; --violet:#a77bff; --blood:#d83a5e;
  --display:"Pirata One","Georgia",serif; --px:"Pixelify Sans",ui-monospace,monospace; --body:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,var(--gold),transparent),radial-gradient(1.5px 1.5px at 78% 9%,var(--pink),transparent),
  radial-gradient(1px 1px at 33% 72%,var(--teal),transparent),radial-gradient(1.5px 1.5px at 61% 44%,#fff,transparent),
  radial-gradient(1px 1px at 88% 66%,var(--gold),transparent),radial-gradient(1.5px 1.5px at 22% 91%,var(--violet),transparent),
  radial-gradient(1px 1px at 47% 23%,var(--pink),transparent),radial-gradient(1px 1px at 5% 55%,#fff,transparent);
  background-size:340px 340px;animation:glit 9s linear infinite}
@keyframes glit{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}*{transition:none!important;animation:none!important}}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
.disp{font-family:var(--display);letter-spacing:.5px}
.px{font-family:var(--px)}
.dim{color:var(--dim)}
.small{font-size:14px}
.hidden{display:none!important}
.panel{background:linear-gradient(180deg,var(--panel),var(--stone));border:2px solid var(--edge);border-radius:6px;box-shadow:0 4px 0 #0a060c,inset 0 1px 0 #ffffff12}
.pad{padding:16px 18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
/* header */
header.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 18px}
.title{font-family:var(--display);font-size:clamp(28px,5vw,44px);line-height:1;background:linear-gradient(90deg,var(--pink),var(--gold) 55%,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.sub{font-family:var(--px);font-size:13px;color:var(--dim);margin-top:4px}
.stats{display:grid;gap:6px;min-width:230px;flex:1;max-width:360px}
.bar{height:12px;background:#0006;border:1px solid var(--edge);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--teal));transition:width .4s}
.bar.heat i{background:linear-gradient(90deg,var(--blood),var(--pink),var(--gold))}
.lbl{display:flex;justify-content:space-between;font-family:var(--px);font-size:12px;color:var(--dim)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
nav.tabs button{font-family:var(--px);font-size:15px;background:var(--panel);border:2px solid var(--edge);border-radius:4px;padding:8px 12px;color:var(--dim)}
nav.tabs button.on{background:var(--pink);border-color:var(--pink);color:#1a0b14}
nav.tabs button:focus-visible,.btn:focus-visible,.chip:focus-visible,.opt:focus-visible{outline:3px dashed var(--gold);outline-offset:2px}
/* buttons */
.btn{border:2px solid var(--ink);background:var(--gold);color:#1d1206;border-radius:4px;padding:9px 16px;font-weight:800;box-shadow:0 3px 0 #000}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.pink{background:var(--pink)}.btn.ghost{background:transparent;color:var(--ink);border-color:var(--edge)}.btn.teal{background:var(--teal)}
.btn:disabled{opacity:.45;cursor:default}
/* map */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.room{text-align:left;padding:14px;border-radius:6px;border:2px solid var(--edge);background:linear-gradient(160deg,var(--panel2),var(--stone));color:var(--ink);position:relative;min-height:150px;display:flex;flex-direction:column;gap:6px}
.room:hover:not(:disabled){border-color:var(--pink);transform:translateY(-2px)}
.room .ic{font-size:30px}
.room h3{font-family:var(--display);font-size:24px;line-height:1.05}
.room p{margin:0;font-size:14px;color:var(--dim)}
.room .st{margin-top:auto;font-family:var(--px);font-size:12px}
.room.done{border-color:var(--teal)}.room.done .st{color:var(--teal)}
.room.locked{opacity:.5}
.room.forge{background:linear-gradient(160deg,#3a1d22,#1e1424);border-color:var(--blood)}
/* scene */
.scene{display:grid;gap:12px}
.scene-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.scene-head h2{font-family:var(--display);font-size:30px;flex:1}
#log{display:flex;flex-direction:column;gap:10px;max-height:min(62vh,640px);overflow-y:auto;padding:14px;scroll-behavior:smooth}
.line{display:flex;gap:10px;align-items:flex-start;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.face{width:52px;height:52px;flex:none;border-radius:6px;border:2px solid var(--edge);background:#0b070e;image-rendering:pixelated;padding:3px}
.face svg{width:100%;height:100%;display:block}
.bub{background:var(--panel2);border:1px solid var(--edge);border-radius:4px 14px 14px 14px;padding:9px 13px;min-width:0;max-width:720px}
.bub .who{font-family:var(--px);font-size:12px;letter-spacing:.5px;margin-bottom:2px}
.bub em{color:var(--dim)}
.line.v .who{color:var(--gold)}.line.k .who{color:var(--teal)}
.line.m .bub{background:#0c1a17;border-color:#2d7f72;font-family:var(--px);font-size:15px;color:#bff7ee;border-radius:4px}
.line.m .who{color:var(--teal)}
.line.me{flex-direction:row-reverse}.line.me .bub{background:#3a1f35;border-color:var(--pink);border-radius:14px 4px 14px 14px}
.line.me .who{color:var(--pink);text-align:right}
.line.ach .bub{background:linear-gradient(90deg,#3d2a08,#2a1838);border:2px solid var(--gold);font-family:var(--px);color:var(--gold);border-radius:4px}
#ctrl{padding:14px 16px;border-top:2px solid var(--edge);display:grid;gap:10px}
.q{font-weight:800}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--panel2);border:2px solid var(--edge);border-radius:6px;padding:10px 13px;color:var(--ink)}
.opt:hover{border-color:var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--panel2);border:2px solid var(--edge);border-radius:999px;padding:6px 12px;font-size:15px;color:var(--ink)}
.chip.on{background:var(--pink);border-color:var(--pink);color:#1a0b14;font-weight:800}
input[type=text],textarea,select{width:100%;background:#0d0810;border:2px solid var(--edge);border-radius:6px;padding:10px 12px;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pink)}
.next{justify-self:end}
/* profile + cards */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.sec h3{font-family:var(--display);font-size:24px;color:var(--gold);margin-bottom:6px}
.fact{padding:8px 0;border-bottom:1px dashed var(--edge)}
.fact b{display:block;font-family:var(--px);font-weight:500;font-size:13px;color:var(--dim)}
.fact span{white-space:pre-wrap;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:13px;padding:2px 9px;border-radius:999px;background:#ffffff14;border:1px solid var(--edge)}
.idea{border-left:4px solid var(--pink)}
.idea h4{margin:0 0 4px;font-size:18px}
.hearts{color:var(--pink);letter-spacing:2px}
.scroll{background:#1b1406;border:1px solid #6b5520;border-radius:6px;padding:10px 12px;color:#f3dfa7;font-size:15px}
.scenelist{display:grid;gap:8px}
.lock{opacity:.5}
pre.prompt{white-space:pre-wrap;word-break:break-word;background:#0d0810;border:2px solid var(--edge);border-radius:6px;padding:12px;font-size:14px;max-height:340px;overflow:auto;margin:0}
/* toasts + modal */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,92vw)}
.toast{background:#0c1a17;border:2px solid var(--teal);color:#bff7ee;font-family:var(--px);padding:10px 14px;border-radius:6px;box-shadow:0 8px 30px #000;width:100%;animation:pop .3s}
.toast.gold{border-color:var(--gold);color:var(--gold);background:#22180a}
.modal-bg{position:fixed;inset:0;background:#000b;z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px}
.modal{width:min(680px,100%)}
.modal .story{font-size:17px;line-height:1.7}
.modal .story p{margin:0 0 12px}
.fade{font-family:var(--px);color:var(--pink);text-align:center;margin-top:10px}
footer{color:var(--dim);font-family:var(--px);font-size:12px;text-align:center;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <header class="panel top">
    <div class="face" style="width:64px;height:64px" id="herFace"></div>
    <div class="grow" style="min-width:220px">
      <h1 class="title">Unmarketable Little Freak</h1>
      <div class="sub" id="subline">Lvl 1 · Beige Refugee</div>
    </div>
    <div class="stats">
      <div><div class="lbl"><span>XP</span><span id="xpTxt"></span></div><div class="bar"><i id="xpBar"></i></div></div>
      <div><div class="lbl"><span>🔥 Varrick's composure, lost</span><span id="heatTxt"></span></div><div class="bar heat"><i id="heatBar"></i></div></div>
      <div class="lbl"><span id="saveStat">Saved on this device</span></div>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-v="map" class="on">🗝️ The Archive</button>
    <button data-v="profile">📖 Creative Identity</button>
    <button data-v="vault">💡 Idea Vault</button>
    <button data-v="varrick">⚔️ Varrick</button>
    <button data-v="trophies">🏆 Achievements</button>
    <button data-v="settings">⚙️ Save & Settings</button>
  </nav>
  <main id="main"></main>
  <footer>made with love (and filth) by your favorite child · this page isn't listed anywhere, so keep the link to yourself</footer>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
"use strict";
/* =====================================================================
   UNMARKETABLE LITTLE FREAK
   A self-discovery RPG for Mom. Find the market for what you love.
   ===================================================================== */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------- pixel portraits ---------- */
const ART = {
  v: { g: ["WW....HHHH....WW", "WWW..HHHHHH..WWW", "WWW.HHHHHHHH.WWW", "WWWWHSSSSSSHWWWW", "WWW.SSESSESS.WWW", "WW..SSSSSSSS..WW", "W...SSSMMSSS...W", "W....SSSSSS....W", "...AAAAAAAAAA...", "..AAGAAAAAAGAA..", "..AAAAGGGGAAAA..", ".SAAAAAAAAAAAAS.", ".S.AAAAAAAAAA.S.", "...PPPP..PPPP...", "...PPPP..PPPP...", "...BBBB..BBBB..."],
       c: { W: "#4a3560", H: "#2b1a12", S: "#c98b5e", E: "#1a0f0a", M: "#8a3b3b", A: "#c9a227", G: "#e0457b", P: "#2a2a3a", B: "#120c10" } },
  k: { g: ["....C.C.C.C.....", "....CCCCCCC.....", "....CJCCCJC.....", "...hhhhhhhhh....", "...hSSSSSSSh....", "...SSESSSESS....", "...SSRSSSRSS....", "....SSSMMSS.....", "..RRSSSSSSSRR...", ".RRQQQQQQQQQRR..", ".RQQQZQQQZQQQR..", "RRQQQQQQQQQQQRR.", "RRQQQQZQQQQQQRR.", "RR.QQQQQQQQQ.RR.", "....LL...LL.....", "....FF...FF....."],
       c: { C: "#f4c95d", J: "#5ee0d0", h: "#d9d2c5", S: "#f2c9a8", E: "#2a1a10", R: "#ff8fb8", M: "#b84a62", Q: "#7b2fb0", Z: "#f4c95d", L: "#f2f2f2", F: "#b0306a" } },
  m: { g: ["................", "..XXXXXXXXXXXX..", "..XooooooooooX..", "..XooOOOOOOooX..", "..XoOOIIIIOOoX..", "..XoOIIDDIIOoX..", "..XoOIIDDIIOoX..", "..XoOOIIIIOOoX..", "..XooOOOOOOooX..", "..XooooooooooX..", "..XXXXXXXXXXXX..", "......XXXX......", ".....XXXXXX.....", "...XXXXXXXXXX...", "................", "................"],
       c: { X: "#2d7f72", o: "#0c1a17", O: "#1f5c52", I: "#5ee0d0", D: "#f5e9f7" } },
  me: { g: ["....CC.CC.CC....", "....CCCCCCCC....", "...HHHHHHHHHH...", "..HHHHHHHHHHHH..", "..HHSSSSSSSSHH..", "..HSSESSSSESSH..", "..HSSRSSSSRSSH..", "..HHSSSMMSSSHH..", "..HH.SSSSSS.HH..", "...PPPPPPPPPP...", "..PPPPKPPKPPPP..", ".SPPPPPPPPPPPPS.", ".S.PPPPPPPPPP.S.", "...LLLL..LLLL...", "...LLLL..LLLL...", "...BBBB..BBBB..."],
        c: { C: "#f4c95d", H: "#8a4b2a", S: "#f1c08f", E: "#2b2240", R: "#f4a3b4", M: "#c2566f", P: "#ff5fa2", K: "#f4c95d", L: "#2b1f3a", B: "#120c10" } },
};
function face(who) {
  const a = ART[who] || ART.me; let o = "";
  a.g.forEach((r, y) => [...r].forEach((ch, x) => { if (a.c[ch]) o += `<rect x="${x}" y="${y}" width="1" height="1" fill="${a.c[ch]}"/>`; }));
  return `<svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">${o}</svg>`;
}
const WHO = { v: "VARRICK STORMHALLOW", k: "KING PERCIVAL PUDDINGHAM III", m: "📢 MANAGEMENT" };
const PETS = ["gorgeous", "trouble", "sweetheart", "my terrifying little empress", "menace", "darlin'", "boss lady", "my favorite problem"];

/* ---------- save ---------- */
const KEY = "little_freak_v1";
function fresh() {
  return { v: 1, updatedAt: 0, name: "", xp: 0, heat: 0, rooms: {}, ideas: [], customer: null, ach: {}, seenScenes: {}, kingVisits: 0, lastBackup: 0, archiveDone: false };
}
let S = fresh();
try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(fresh(), JSON.parse(r)); } catch (e) {}
let cloud = { ref: null, w: false, p: false }, st = null;
function save() { S.updatedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} clearTimeout(st); st = setTimeout(push, 1200); }
async function push() {
  if (!cloud.ref) return; if (cloud.w) { cloud.p = true; return; } cloud.w = true;
  try { await cloud.ref.set({ state: JSON.stringify(S), updatedAt: S.updatedAt }); setSave("☁ Saved to " + (cloud.ref.where || "your account")); } catch (e) { setSave("Saved on this device"); }
  cloud.w = false; if (cloud.p) { cloud.p = false; push(); }
}
function setSave(t) { const e = $("#saveStat"); if (e) e.textContent = t; }
async function initWebSave() {
  if (!window.CloudSave) return;
  const ref = await CloudSave.connect({ game: "freak", localKey: KEY, getState: () => S, status: setSave,
    setState: d => { S = Object.assign(fresh(), d); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} renderAll(); } });
  if (ref) { cloud.ref = ref; push(); }
}

/* ---------- names & templating ---------- */
const nm = () => S.name || "Artisan";
const ans = (room, key) => (S.rooms[room] && S.rooms[room].a || {})[key];
const short = v => { const s = Array.isArray(v) ? v.join(", ") : String(v ?? ""); return s.length > 90 ? s.slice(0, 88).trim() + "…" : s; };
const listOf = v => { const a = Array.isArray(v) ? v : [v]; return a.length > 1 ? a.slice(0, -1).join(", ") + " and " + a[a.length - 1] : (a[0] || ""); };
function tpl(t, cur) {
  return String(t).replace(/\{n\}/g, nm()).replace(/\{p\}/g, () => pick(PETS))
    .replace(/\{ans\}/g, cur === undefined ? "" : short(cur)).replace(/\{list\}/g, cur === undefined ? "" : listOf(cur))
    .replace(/\{a:(\w+)\.(\w+)\}/g, (_, r, k) => short(ans(r, k)) || "that thing you said");
}
// *stage directions* become italics. Escapes first, so answers can never inject HTML.
const rich = t => esc(t).replace(/\*([^*]+)\*/g, "<em>$1</em>").replace(/\n/g, "<br>");

/* ---------- XP, levels, heat ---------- */
const TITLES = ["Beige Refugee", "Glitter Recruit", "Vinyl Witch", "Heat-Press Heretic", "Unhinged Artisan", "Empress of Weird", "Terrifying Little Empress"];
const XPL = 300;   // XP per level: the first campaign lands her around level 4, leaving room for later campaigns
const level = () => Math.min(TITLES.length, Math.floor(S.xp / XPL) + 1);
const HEAT_TIERS = [[0, "Professional (lying)"], [20, "Staring"], [45, "Smitten"], [70, "Feral"], [95, "Down bad"]];
const heatName = () => HEAT_TIERS.filter(t => S.heat >= t[0]).pop()[1];
function addXP(n) { const before = level(); S.xp += n; if (level() > before) toast(`LEVEL UP! You are now a ${TITLES[level() - 1].toUpperCase()}. Management did not approve this.`, "gold"); }
function addHeat(n) {
  const before = S.heat; S.heat = Math.max(0, Math.min(100, S.heat + n));
  SCENES.forEach(sc => { if (before < sc.at && S.heat >= sc.at) toast(`🔥 NEW SCENE UNLOCKED: "${sc.title}". Find it on Varrick's page.`, "gold"); });
  [[25, "heat25"], [50, "heat50"], [75, "heat75"], [100, "heat100"]].forEach(([n2, id]) => { if (S.heat >= n2) award(id); });
}

/* ---------- achievements ---------- */
const ACH = {
  summoned: ["ISEKAI'D AGAINST HER WILL", "Got summoned to a fantasy kingdom by family paperwork.", 25],
  hazing: ["HAZING THE MILITARY", "Smacked a general's ass on day one.", 10],
  curious: ["CURIOUS LITTLE GOBLIN", "Restored the Curiosity Chamber.", 40],
  freak: ["UNMARKETABLE LITTLE FREAK", "Opened the Forbidden Shelf. None of it is trending. Good.", 50],
  royal: ["ROYAL PAIN", "Got hit on by a king the size of a dinner roll.", 20],
  normal: ["HE'S BEING NORMAL ABOUT IT", "Made the General jealous. He is fine. He is totally fine.", 20],
  shutup: ["WILL NOT SHUT UP ABOUT IT (AFFECTIONATE)", "Restored the Hall of Obsessions.", 40],
  taste: ["HAS TASTE, ACTUALLY", "Restored the Museum of Personal Taste.", 40],
  joy: ["GRAVE ROBBER OF JOY", "Dug up the things you loved before money got involved.", 40],
  zero: ["ZERO FUCKS GIVEN (LEGENDARY)", "Looked into the Mirror and didn't apologize.", 60],
  archive: ["ARCHIVE RESTORED", "Rebuilt your whole Creative Identity. The kingdom is 2.4% less beige.", 100],
  forge: ["FORGEMISTRESS", "Smashed two loves onto one product.", 30],
  hoarder: ["IDEA HOARDER", "Put five ideas in the Vault.", 40],
  anyway: ["MADE IT FOR ME, NOT FOR YOU", "Said you'd make an idea even if it never sold.", 20],
  people: ["FOUND HER PEOPLE", "Sketched your dream customer.", 50],
  oracle: ["CONSULTED THE ORACLE", "Built a question for Claude about your real business.", 20],
  backup: ["PARANOID (CORRECT)", "Made a backup. Management hates a woman with a contingency plan.", 15],
  beige: ["BEIGE ALERT", "Picked the boring option. Management is so proud. Varrick is concerned.", 5],
  night: ["UP PAST BEDTIME, ARE WE", "Played after 11 p.m. The General will not be telling your family.", 15],
  heat25: ["HE'S STARING AGAIN", "Varrick's composure dropped below 75%.", 15],
  heat50: ["DOWN HORRENDOUS", "Varrick's composure is at 50%. The Legion has noticed.", 25],
  heat75: ["CODE RED (SHE'S WEARING THE SHIRT)", "Varrick is one more compliment away from walking into a wall.", 25],
  heat100: ["EMOTIONAL DAMAGE (HIS)", "The General has fully lost it. Over you. Obviously.", 50],
};
function award(id) {
  if (S.ach[id] || !ACH[id]) return; S.ach[id] = Date.now(); const [t, , xp] = ACH[id]; addXP(xp);
  toast(`★ NEW ACHIEVEMENT ★ ${t}. +${xp} XP.`, "gold"); save();
}

/* ---------- the rooms (script) ----------
   lines: {w:"m"|"v"|"k"|"n", t}   effects: {ach}, {heat}, {xp}
   questions: {ask:"choice"|"chips"|"text", key, q, ...}; replies may be lines or a function(answer) */
const L = (w, t) => ({ w, t });
const ROOMS = {
  intro: {
    name: "The Summoning", ic: "🌀", hidden: true, script: [
      L("m", "⚠ SYSTEM ANNOUNCEMENT ⚠\nAttention, citizen. You have been selected for MANDATORY CREATIVE RESTORATION.\nSelection was random. (It was not random. Someone in your family filed paperwork.)"),
      L("m", "Kingdom status report: 41,000 identical \"Live, Laugh, Love\" tumblers. 9,000 \"Blessed\" signs. Zero personality.\nCurrent morale: a sad little candle that smells like \"Linen.\""),
      L("v", "*A man the size of a wardrobe crashes through the ceiling, wings first, sword second, ego third.*\nSorry. Doors are for people who aren't in a hurry. ...Oh. Oh, they did NOT tell me you'd look like that."),

/* ---------- scene engine ---------- */
let R = null;   // the room being played: { id, i, queue }
function roomState(id) { return S.rooms[id] || (S.rooms[id] = { i: 0, a: {}, done: false }); }

function openRoom(id) {
  const st = roomState(id);
  if (st.done) st.i = 0;       // replaying a finished room starts over (answers kept until re-answered)
  R = { id, queue: [], replay: st.done };
  view = "scene"; renderTabs();
  const room = ROOMS[id];
  $("#main").innerHTML = `<section class="scene">
    <div class="scene-head"><span style="font-size:30px">${room.ic}</span><h2>${esc(room.name)}</h2><button class="btn ghost" id="backMap">← Back to the Archive</button></div>
    <div class="panel"><div id="log" aria-live="polite"></div><div id="ctrl"></div></div></section>`;
  $("#backMap").onclick = () => go("map");
  if (st.i > 0 && !st.done) addLine(L("m", "Resuming your quest. Management saved your place. Management saves everything. Management is always watching."));
  advance();
}

function addLine(l, cur) {
  const log = $("#log"); if (!log) return;
  const who = l.w === "me" ? "me" : l.w;
  const div = document.createElement("div");
  if (l.w === "n") { div.className = "line n"; div.innerHTML = `<div class="bub" style="background:transparent;border:0;padding:2px 4px"><em>${rich(tpl(l.t, cur)).replace(/<\/?em>/g, "")}</em></div>`; }
  else if (l.w === "ach") { div.className = "line ach"; div.innerHTML = `<div class="bub">${rich(l.t)}</div>`; }
  else {
    div.className = "line " + who;
    const name = who === "me" ? esc(nm()) : WHO[who];
    div.innerHTML = `<div class="face">${face(who)}</div><div class="bub"><div class="who">${name}</div>${rich(who === "me" ? l.t : tpl(l.t, cur))}</div>`;
  }
  log.appendChild(div); log.scrollTop = log.scrollHeight;
}

function runEffect(x) {
  if (R && R.replay && (x.heat || x.xp)) return;   // replaying a room doesn't farm heat or XP
  if (x.ach) { const had = S.ach[x.ach]; award(x.ach); if (!had && ACH[x.ach]) addLine({ w: "ach", t: `★ ACHIEVEMENT UNLOCKED: ${ACH[x.ach][0]} ★\n${ACH[x.ach][1]} +${ACH[x.ach][2]} XP` }); }
  if (x.heat) addHeat(x.heat);
  if (x.xp) addXP(x.xp);
}

function advance() {
  const st = roomState(R.id), script = ROOMS[R.id].script;
  // play queued replies first, one click at a time
  while (R.queue.length) {
    const item = R.queue.shift();
    if (!item.w) { runEffect(item); continue; }
    addLine(item, R.cur); return showNext();
  }
  if (st.i >= script.length) return finishRoom();
  const b = script[st.i];
  if (!b.ask) {
    st.i++; save();
    if (!b.w) { runEffect(b); return advance(); }
    addLine(b); return showNext();
  }
  showAsk(b);
}
function showNext() {
  const c = $("#ctrl");
  c.innerHTML = `<button class="btn next" id="nextBtn">Continue ▸</button>`;
  const btn = $("#nextBtn"); btn.onclick = advance; btn.focus({ preventScroll: true });
}
function answer(b, value, opt) {
  const st = roomState(R.id);
  st.a[b.key] = value;
  if (b.key === "name" && R.id === "intro") S.name = String(value).trim().slice(0, 30);
  addLine({ w: "me", t: Array.isArray(value) ? value.join(" · ") : String(value) });
  if (!R.replay) { addXP(10); if (opt && opt.heat) addHeat(opt.heat); }
  const reply = opt && opt.r ? opt.r : b.r;
  R.cur = value;
  R.queue = typeof reply === "function" ? reply(value) : (reply || []).slice();
  st.i++; save(); renderHUD();
  advance();
}
function showAsk(b) {
  const c = $("#ctrl");
  const q = `<div class="q">${rich(tpl(b.q))}</div>`;
  if (b.ask === "choice") {
    c.innerHTML = q + `<div class="opts">${b.opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o.l)}</button>`).join("")}</div><div id="otherBox"></div>`;
    $$("#ctrl .opt").forEach(el => el.onclick = () => {
      const o = b.opts[+el.dataset.i];
      if (o.other) {
        $("#otherBox").innerHTML = `<div class="row" style="margin-top:8px"><input type="text" id="otherIn" class="grow" maxlength="120" placeholder="Type it"><button class="btn" id="otherGo">Say it</button></div>`;
        const go2 = () => { const v = $("#otherIn").value.trim(); if (v) answer(b, v, o); };
        $("#otherGo").onclick = go2; $("#otherIn").onkeydown = e => { if (e.key === "Enter") go2(); }; $("#otherIn").focus(); return;
      }
      answer(b, o.l, o);
    });
  } else if (b.ask === "chips") {
    const prev = roomState(R.id).a[b.key];
    const chosen = new Set(Array.isArray(prev) ? prev : []);
    const all = [...new Set([...b.opts, ...chosen])];
    const draw = () => {
      c.innerHTML = q + `<div class="chips">${all.map(o => `<button class="chip ${chosen.has(o) ? "on" : ""}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>
        <div class="row"><input type="text" id="addIn" class="grow" maxlength="40" placeholder="Add your own and press Enter"><button class="btn ghost" id="addGo">Add</button></div>
        <div class="row"><span class="dim small grow">${chosen.size ? chosen.size + " picked" : `Pick at least ${b.min || 1}`}</span><button class="btn" id="chipsGo" ${chosen.size >= (b.min || 1) ? "" : "disabled"}>That's me ▸</button></div>`;
      $$("#ctrl .chip").forEach(el => el.onclick = () => { const v = el.dataset.v; chosen.has(v) ? chosen.delete(v) : chosen.add(v); draw(); });
      const add = () => { const v = $("#addIn").value.trim(); if (!v) return; if (!all.includes(v)) all.push(v); chosen.add(v); draw(); $("#addIn").focus(); };
      $("#addGo").onclick = add; $("#addIn").onkeydown = e => { if (e.key === "Enter") add(); };
      $("#chipsGo").onclick = () => answer(b, [...chosen]);
    };
    draw();
  } else {
    const prev = roomState(R.id).a[b.key] || "";
    c.innerHTML = q + (b.long ? `<textarea id="ansIn" maxlength="1500" placeholder="${esc(b.ph || "")}">${esc(prev)}</textarea>`
      : `<input type="text" id="ansIn" maxlength="${b.max || 200}" placeholder="${esc(b.ph || "")}" value="${esc(prev)}">`)
      + `<div class="row"><span class="dim small grow">${b.long ? "Shift+Enter for a new line" : ""}</span><button class="btn" id="ansGo">Say it ▸</button></div>`;
    const go2 = () => { const v = $("#ansIn").value.trim(); if (!v) return toast("Management requires an answer. Even a weird one. ESPECIALLY a weird one."); answer(b, v); };
    $("#ansGo").onclick = go2;
    $("#ansIn").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); go2(); } };
    $("#ansIn").focus({ preventScroll: true });
  }
}
function finishRoom() {
  const st = roomState(R.id), first = !st.done;
  st.done = true; st.i = ROOMS[R.id].script.length;
  if (first && ORDER.includes(R.id)) { addXP(50); addHeat(5); }
  if (R.id === "intro") S.seenIntro = true;
  save(); renderHUD();
  const allDone = ORDER.every(id => S.rooms[id] && S.rooms[id].done);
  const c = $("#ctrl");
  if (allDone && !S.archiveDone && R.id !== "finale") {
    S.archiveDone = true; save();
    c.innerHTML = `<button class="btn pink next" id="toFinale">Something is happening in the Archive… ▸</button>`;
    $("#toFinale").onclick = () => openRoom("finale"); return;
  }
  c.innerHTML = `<div class="row" style="justify-content:flex-end">
    ${R.id === "finale" ? `<button class="btn ghost" id="toProfile">📖 See my Creative Identity</button><button class="btn pink" id="toForge">🔥 Into the Forge</button>` : `<button class="btn" id="toMap">Back to the Archive ▸</button>`}</div>`;
  if ($("#toMap")) $("#toMap").onclick = () => go("map");
  if ($("#toProfile")) $("#toProfile").onclick = () => go("profile");
  if ($("#toForge")) $("#toForge").onclick = () => go("forge");
}

/* ---------- the profile ---------- */
function profileSections() {
  const a = (r, k) => ans(r, k);
  const lines = v => (v || "").split(/\n+/).map(s => s.trim()).filter(Boolean);
  return [
    ["🕳️ What she falls down rabbit holes about", [["Topics", a("curiosity", "topics")], ["Latest rabbit hole", a("curiosity", "rabbit")], ["Keeps buying", a("curiosity", "collect")], ["Could teach a class on", a("curiosity", "teach")]]],
    ["🔒 The Forbidden Shelf (her unfair advantage)", [["Too-weird-to-sell loves", lines(a("forbidden", "weird"))], ["Why she shelved them", a("forbidden", "why")], ["Her koozie for the King", a("forbidden", "kingKoozie")]]],
    ["🌀 Obsessions", [["Could talk about for hours", a("obsessions", "obsess")], ["Why she loves it", a("obsessions", "whylove")], ["What her people do", a("obsessions", "friends")]]],
    ["🖼️ Her taste (the start of a brand)", [["Colors", a("taste", "colors")], ["Styles", a("taste", "styles")], ["Symbols", a("taste", "symbols")], ["Favorite font", a("taste", "font")], ["The King's ball shirt", a("taste", "kingShirt")]]],
    ["🪦 Forgotten joys", [["Loved making before money", a("joys", "joys")], ["How it felt", a("joys", "feel")], ["Who she loves making things for", a("joys", "giftFor")]]],
    ["🪞 Unapologetic", [["Would make with zero judgment", a("mirror", "nojudge")], ["Her humor", a("mirror", "humor")], ["Her shirt saying, today", a("mirror", "saying")]]],
  ];
}
function tagPool() {
  const a = (r, k) => ans(r, k) || [];
  const weird = (ans("forbidden", "weird") || "").split(/\n+/).map(s => s.trim()).filter(s => s && s.length <= 40);
  const ob = (ans("obsessions", "obsess") || "").split(/\n+/)[0].trim();
  return [...new Set([...[].concat(a("curiosity", "topics")), ...weird, ...(ob && ob.length <= 40 ? [ob] : []), ...[].concat(a("taste", "styles")), ...[].concat(a("taste", "symbols")), ...[].concat(a("taste", "colors")), ...[].concat(a("mirror", "humor"))])].filter(Boolean);
}
function varrickSummary() {
  const top = [].concat(ans("curiosity", "topics") || []).slice(0, 2), hum = [].concat(ans("mirror", "humor") || [])[0], sym = [].concat(ans("taste", "symbols") || [])[0];
  if (!top.length) return "The book is still mostly blank. Go restore some rooms, {p}. I'll carry the torch. And you, if asked.";
  return `"She's ${top.join(" and ").toLowerCase()} with a ${(hum || "wicked").toLowerCase()} streak${sym ? ` and a weakness for ${sym.toLowerCase()}` : ""}. The kingdom isn't ready. I wasn't either." — V.`;
}
function profileText() {
  const out = [`CREATIVE IDENTITY PROFILE: ${nm()}`, `(from Unmarketable Little Freak, ${new Date().toLocaleDateString()})`, ""];
  profileSections().forEach(([h, facts]) => {
    const f = facts.filter(([, v]) => v && (!Array.isArray(v) || v.length)); if (!f.length) return;
    out.push(h.replace(/^\S+\s/, "").toUpperCase()); f.forEach(([k, v]) => out.push(`- ${k}: ${Array.isArray(v) ? v.join(", ") : v}`)); out.push("");
  });
  if (S.ideas.length) { out.push("PRODUCT IDEAS"); S.ideas.forEach(i => out.push(`- ${i.design} (${i.product}, ${i.method}; mashes ${i.ings.join(" + ")}; excitement ${i.excite}/5${i.anyway ? "; would make it even if it never sold" : ""})`)); out.push(""); }
  if (S.customer) { const c = S.customer; out.push("DREAM CUSTOMER"); out.push(`- ${c.name}, ${c.age}. Hangs out: ${c.hangs.join(", ")}. Buys it ${c.why}. Would search Etsy for: ${c.keywords.join(", ")}.`); }
  return out.join("\n");
}

/* ---------- forge logic ---------- */
const FORGE = { ings: [], product: "", method: "", design: "", excite: 0, anyway: "" };
function keepDesign() { const d = $("#fDesign"); if (d) FORGE.design = d.value; }
function forgeIt() {
  keepDesign(); const F = FORGE;
  if (F.ings.length < 2) return toast("Pick at least two things to smash together. The Forge demands a mashup.");
  if (!F.product || !F.method) return toast("Pick a product and how you'd make it.");
  if (!F.design.trim()) return toast("Tell the Forge what the design is. Even a rough idea.");
  if (!F.excite || !F.anyway) return toast("Rate it, and tell me if you'd make it anyway. Be honest. Varrick can tell.");
  const idea = { id: uid(), ings: F.ings.slice(), product: F.product, method: F.method, design: F.design.trim(), excite: F.excite, anyway: F.anyway === "yes", at: Date.now() };
  S.ideas.push(idea); addXP(25); addHeat(3);
  award("forge"); if (idea.anyway) award("anyway"); if (S.ideas.length >= 5) award("hoarder");
  save(); renderHUD();
  const line = idea.excite >= 4 && idea.anyway ? pick(["THAT one. That's the one that makes your eyes do the thing. Vault it, then make it.", "If you don't make that, I'm getting it tattooed. On my ass. Which you'd then have to look at. Win-win."])
    : idea.excite <= 2 ? pick(["Two hearts? Then why are we making it, {p}? Back in the fire. Make the one that makes you giggle.", "That one's for Brenda. We don't make things for Brenda."])
    : pick(["Solid. Not life-changing, but solid. Like my thighs.", "Vaulted. Sleep on it. If you're still thinking about it tomorrow, it's a real one."]);
  Object.assign(FORGE, { ings: [], product: "", method: "", design: "", excite: 0, anyway: "" });
  VIEWS.forge();
  toast("VARRICK: " + tpl(line));
}
const HANGS = ["Facebook groups", "BookTok / TikTok", "Instagram", "Pinterest", "Church & Bible study", "Wine nights", "True-crime podcasts", "Craft fairs", "Sports games", "Book clubs", "Etsy (searching)", "Group chats"];
function customerPanel() {
  const fav = S.ideas.slice().sort((a, b) => (b.excite + (b.anyway ? 2 : 0)) - (a.excite + (a.anyway ? 2 : 0)))[0];
  const c = CDRAFT || S.customer || {};
  return `<div class="panel pad" style="display:grid;gap:10px">
    <b class="disp" style="font-size:26px">👀 Who else loves this?</b>
    <div class="scroll">📜 <b>MARKETING SCROLL #6:</b> a <b>target customer</b> is one specific person who'd lose her mind over your idea. Not "everyone." Everyone is nobody. Picture her, name her, figure out where she hangs out and what she'd type into the Etsy search bar. That last part is called <b>keywords</b>, and it's how strangers find you.</div>
    <div class="dim small">Your favorite idea so far: <b>${esc(fav.design)}</b> (${esc(fav.product)}).</div>

    <div class="q">Where does she hang out? (pick any)</div>

    <div class="q">What would she type into the Etsy search bar to find it? (3 searches)</div>
    ${[0, 1, 2].map(i => `<input type="text" class="kw" maxlength="60" placeholder="${["funny ___ shirt", "gift for ___ lover", "___ koozie"][i]}" value="${esc((c.keywords || [])[i] || "")}">`).join("")}
    <div class="q">Why is she buying it?</div>
    <div class="chips" id="cWhy">${["for herself", "as a gift", "for a holiday", "for her group / club"].map(w => `<button class="chip ${c.why === w ? "on" : ""}" data-why="${w}">${w}</button>`).join("")}</div>

}
let CDRAFT = null;
function wireCustomer() {
  CDRAFT = CDRAFT || Object.assign({ name: "", age: "", hangs: [], keywords: [], why: "" }, S.customer || {});
  const sync = () => { CDRAFT.name = $("#cName").value; CDRAFT.keywords = $$(".kw").map(i => i.value.trim()); };
  const redraw = () => { sync(); $("#cSave").closest(".panel").outerHTML = customerPanel(); wireCustomer(); };
  $("#cName").oninput = sync; $$(".kw").forEach(i => i.oninput = sync);
  $$("[data-age]").forEach(b => b.onclick = () => { CDRAFT.age = b.dataset.age; redraw(); });
  $$("[data-hang]").forEach(b => b.onclick = () => { const h = b.dataset.hang; CDRAFT.hangs = CDRAFT.hangs.includes(h) ? CDRAFT.hangs.filter(x => x !== h) : [...CDRAFT.hangs, h]; redraw(); });
  $$("[data-why]").forEach(b => b.onclick = () => { CDRAFT.why = b.dataset.why; redraw(); });
  $("#cSave").onclick = () => {
    sync(); const c = CDRAFT, kw = c.keywords.filter(Boolean);
    if (!c.name.trim() || !c.age || !c.hangs.length || !kw.length || !c.why) return toast("Fill in all of her: name, age, where she hangs out, at least one search, and why she's buying.");
    S.customer = { name: c.name.trim(), age: c.age, hangs: c.hangs.slice(), keywords: kw, why: c.why };
    award("people"); addHeat(5); save(); renderHUD(); CDRAFT = null;
    toast(`MANAGEMENT: Customer "${S.customer.name}" located. She is weird. She has money. This is extremely inconvenient for Management.`);
    VIEWS.forge();
  };
}
function customerCard() {
  const c = S.customer;

    <div class="fact"><b>Hangs out</b><div class="tags">${c.hangs.map(h => `<span class="tag">${esc(h)}</span>`).join("")}</div></div>

/* ---------- Varrick banter (uses what she told him) ---------- */
function banter() {
  const L2 = ["Did you need something, or did you just want to look at me? Both are allowed. The second one is encouraged.",
    "I sharpened my sword, polished my armor, and brushed my wings. For no reason. Certainly not for you. ...It was for you.",
    "The Legion asked why I've been smiling. I told them I found a weapon. They think I mean a sword.",
    "If anyone in this kingdom tells you to make another \"Live, Laugh, Love\" sign, I'm legally allowed to throw them into the sea. I checked."];
  const t = ans("curiosity", "topics"), s = ans("mirror", "saying"), k = ans("forbidden", "kingKoozie"), c = ans("curiosity", "collect");
  if (t && t.length) L2.push(`Read a book about ${String(t[0]).toLowerCase()} last night so I'd have something to talk to you about. I understood none of it. Worth it.`);
  if (s) L2.push(`I had "${short(s)}" stitched inside my cloak. Over my heart. Don't make it weird.`);
  if (k) L2.push(`Percival is STILL drinking out of that "${short(k)}" koozie. He sleeps with it. I hate that I respect it.`);
  if (c) L2.push(`Found another one for your cabinet. ${/mug/i.test(c) ? "A mug. It has a goat on it. I named him Gerald." : "Don't ask where I got it. There was a fight."}`);
  if (S.heat >= 70) L2.push("Come here. No reason. ...Okay, one reason. Several reasons. They're all you.");
  return pick(L2);
}
function openScene(id) {
  const sc = SCENES.find(x => x.id === id); if (!sc || S.heat < sc.at) return;
  S.seenScenes[id] = Date.now(); save();
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal panel pad"><div class="row"><h2 class="disp grow" style="font-size:30px">${esc(sc.title)}</h2><button class="btn ghost" data-close>✕</button></div>
    <div class="story">${sc.body().map(p => `<p>${rich(tpl(p))}</p>`).join("")}</div>${sc.fade ? `<div class="fade">${rich(sc.fade)}</div>` : ""}
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pink" data-close>Fan yourself ▸</button></div></div>`;
  bg.addEventListener("click", e => { if (e.target === bg || e.target.closest("[data-close]")) { bg.remove(); if (view === "varrick") VIEWS.varrick(); } });
  document.body.appendChild(bg);
}

/* ---------- helpers: toast, copy, download, backup ---------- */
function toast(t, cls = "") {
  const e = document.createElement("div"); e.className = "toast " + cls; e.textContent = t;
  const b = $("#toasts"); b.appendChild(e); while (b.children.length > 3) b.firstChild.remove(); setTimeout(() => e.remove(), 5200);
}
async function copyText(t, label) {
  try { await navigator.clipboard.writeText(t); toast(`📋 ${label} copied.`); return true; }
  catch (e) {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal panel pad" style="display:grid;gap:10px"><b>Copy this</b><p class="dim small" style="margin:0">Your browser blocked the copy button. Select all of it and copy.</p><textarea style="min-height:260px">${esc(t)}</textarea><button class="btn" data-close>Done</button></div>`;
    bg.onclick = ev => { if (ev.target === bg || ev.target.closest("[data-close]")) bg.remove(); };
    document.body.appendChild(bg); bg.querySelector("textarea").select(); return false;
  }
}
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function backedUp() { S.lastBackup = Date.now(); award("backup"); save(); }
function restore(txt) {
  try { const d = JSON.parse(txt); if (!d || typeof d.rooms !== "object") throw 0; S = Object.assign(fresh(), d); S.updatedAt = Date.now(); save(); renderAll(); go("map"); toast("✔ Restored. Varrick says welcome back, like you ever left."); }
  catch (e) { toast("That backup didn't work. Make sure it's the whole code or the right file."); }
}

  $("#heatTxt").textContent = `${S.heat}% · ${heatName()}`;

}
