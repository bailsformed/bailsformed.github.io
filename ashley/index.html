<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunbeam Farm</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#8cc56b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#4a3423;--ink2:#7a5f48;--parch:#fff6e2;--parch2:#f7e6c0;--edge:#e6c98e;
  --wood:#9a6436;--wood2:#b77b45;--woodd:#5e3a1d;
  --grass:#8cc56b;--grass2:#7ab65a;--soil:#8a5a33;--soil2:#74492a;
  --green:#4f9e4a;--green2:#dff3d2;--amber:#e39a2d;--amber2:#fde9c4;--blue:#4b9fd1;--blue2:#dcefff;
  --pink:#f39bb8;--pink2:#ffe1ea;--lav:#b9a3e8;--sun:#ffd45a;--red:#d9534f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.5;min-height:100vh;padding-bottom:110px;
  background-color:var(--grass);
  background-image:
    linear-gradient(45deg,rgba(255,255,255,.07) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.07) 75%),
    linear-gradient(45deg,rgba(255,255,255,.07) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.07) 75%);
  background-size:32px 32px;background-position:0 0,16px 16px}
.px,h1,h2,h3,.btn,.tab,.chip,.pill{font-family:"Pixelify Sans",Nunito,sans-serif}
h1{font-size:26px;margin:0;line-height:1.1}
h2{font-size:22px;margin:0 0 8px;font-weight:700}
h3{font-size:18px;margin:12px 0 6px;font-weight:600}
p{margin:6px 0}
canvas.spr{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.wrap{max-width:980px;margin:0 auto;padding:12px 14px}
.panel{background:var(--parch);border:4px solid var(--woodd);border-radius:12px;box-shadow:inset 0 0 0 3px var(--edge),0 5px 0 rgba(60,35,15,.35);padding:16px;margin:0 0 16px}
.panel.wood{background:linear-gradient(180deg,var(--wood2),var(--wood));color:#fff5e6;box-shadow:inset 0 0 0 3px #c98f58,0 5px 0 rgba(60,35,15,.35)}
.muted{color:var(--ink2);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.btn{font-size:17px;font-weight:600;border:3px solid var(--woodd);border-radius:10px;padding:8px 14px;cursor:pointer;background:var(--sun);color:var(--ink);box-shadow:0 3px 0 var(--woodd);transition:transform .06s;line-height:1.15}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--woodd)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.green{background:#9fdc7c}.btn.pink{background:var(--pink)}.btn.blue{background:#9ed2f2}.btn.white{background:#fffaf0}.btn.lav{background:var(--lav)}
.btn.sm{font-size:14px;padding:4px 9px;border-width:2px;box-shadow:0 2px 0 var(--woodd)}
.btn.big{font-size:21px;padding:12px 20px}
.btn.link{background:none;border:none;box-shadow:none;padding:2px 4px;text-decoration:underline;color:var(--ink2);font-family:Nunito,sans-serif;font-size:14px}
input,select,textarea{font:inherit;color:var(--ink);background:#fffdf7;border:2px solid #c9a46e;border-radius:8px;padding:7px 9px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:3px solid var(--pink);outline-offset:1px}
textarea{width:100%;min-height:70px;resize:vertical}
label.f{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
.pill{display:inline-block;font-size:13px;padding:1px 8px;border-radius:99px;border:2px solid currentColor;line-height:1.4;white-space:nowrap}
.t-income{color:#2f7d4f}.t-bill{color:#9a5a12}.t-savings{color:#2f6ea5}.t-spending{color:#a8456b}
.toast-wrap{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:var(--parch);border:3px solid var(--woodd);border-radius:10px;padding:8px 14px;box-shadow:0 4px 0 rgba(60,35,15,.35);font-weight:700;animation:pop .25s ease-out;text-align:center}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.floater{position:fixed;z-index:70;font-family:"Pixelify Sans";font-weight:700;font-size:22px;color:#fff;text-shadow:0 2px 0 var(--woodd),0 0 6px var(--woodd);pointer-events:none;animation:floatUp 1.2s ease-out forwards}
@keyframes floatUp{to{transform:translateY(-60px);opacity:0}}

/* header */
.top{display:flex;gap:12px;align-items:center}
.top .who{flex:1;min-width:0}
.top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:14px;background:#e8d6ae;border:2px solid var(--woodd);border-radius:7px;overflow:hidden;margin-top:4px;max-width:340px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#9fdc7c,#5fb85a)}
.starct{color:var(--ink);font-family:"Pixelify Sans";font-size:22px;font-weight:700;background:#fff3c4;border:3px solid var(--woodd);border-radius:10px;padding:4px 10px;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tab{flex:1 1 auto;font-size:16px;font-weight:600;background:#e9d3a6;border:3px solid var(--woodd);border-radius:10px 10px 4px 4px;padding:7px 10px;cursor:pointer;color:var(--ink);text-align:center}
.tab.on{background:var(--parch);box-shadow:inset 0 -4px 0 var(--pink)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:40;font-size:20px;padding:13px 20px;border-radius:14px;background:#9fdc7c;box-shadow:0 5px 0 var(--woodd),0 0 0 4px rgba(255,255,255,.6)}

/* Sen card */
.sen{display:flex;gap:14px;align-items:center}
.bubble{position:relative;background:#fff;border:3px solid var(--woodd);border-radius:12px;padding:10px 14px;flex:1;font-weight:700;font-size:17px}
.bubble:before{content:"";position:absolute;left:-12px;top:22px;border:8px solid transparent;border-right-color:var(--woodd)}
.quest{display:flex;gap:10px;align-items:center;padding:9px 10px;border:2px dashed #d9bb86;border-radius:10px;margin:6px 0;background:#fffaf0}
.quest.done{background:var(--green2);border-style:solid;border-color:#9fcf87}
.quest .ck{font-size:22px;width:28px;text-align:center}
.quest .q{flex:1}
.gift{font-size:52px;cursor:pointer;background:none;border:none;animation:wiggle 2.4s infinite;padding:0}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-10deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}

/* farm */
.months{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}
.months .px{font-size:22px;font-weight:700;min-width:170px;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:#fffaf0;border:3px solid var(--woodd);border-radius:10px;padding:10px 12px}
.tile .k{font-size:13px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
.tile .v{font-family:"Pixelify Sans";font-size:26px;font-weight:700;line-height:1.15}
.tile.gold{background:#fff3c4}
.bar{height:10px;background:#ead8b3;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green)}
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.plot{display:flex;flex-direction:column;align-items:stretch;border:3px solid var(--woodd);border-radius:10px;overflow:hidden;cursor:pointer;background:#fffaf0;text-align:left;padding:0;font:inherit;color:inherit}
.plot .soil{position:relative;height:96px;display:flex;align-items:flex-end;justify-content:center;
  background-color:var(--soil);background-image:repeating-linear-gradient(0deg,var(--soil) 0 10px,var(--soil2) 10px 12px)}
.plot.water .soil{background-color:#b0814f;background-image:repeating-linear-gradient(0deg,#b0814f 0 10px,#9b6e41 10px 12px)}
.plot .badge{position:absolute;top:6px;right:6px;font-size:18px}
.plot .info{padding:7px 9px}
.plot .nm{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plot .st{font-size:12.5px;font-weight:800}
.st.thrive{color:var(--green)}.st.close{color:var(--amber)}.st.water{color:var(--blue)}
.plot.thrive{box-shadow:0 0 0 2px #9fdc7c}.plot.close{box-shadow:0 0 0 2px #f3c06b}.plot.water{box-shadow:0 0 0 2px #9ed2f2}
.board{background:linear-gradient(180deg,#a8703f,#8c5a30);border:4px solid var(--woodd);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.note{background:#fff8de;border-radius:4px;padding:10px 10px 8px;box-shadow:2px 3px 0 rgba(0,0,0,.25);position:relative;transform:rotate(-1deg)}
.note:nth-child(2n){transform:rotate(1.2deg)}
.note:before{content:"";position:absolute;top:-5px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--red);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.note.paid{background:#e4f6d9}
.note label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-weight:800}
.note input{width:20px;height:20px;margin-top:2px;accent-color:var(--green)}
.bin{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.crate{width:96px;height:78px;border:4px solid var(--woodd);border-radius:6px;background:repeating-linear-gradient(0deg,#c58b52 0 14px,#a8703f 14px 17px);position:relative;flex:none}
.crate:after{content:"";position:absolute;left:-8px;right:-8px;top:-12px;height:12px;background:#8c5a30;border:3px solid var(--woodd);border-radius:4px}
.jars{display:flex;gap:16px;flex-wrap:wrap}
.jar{width:130px;text-align:center;cursor:pointer;background:none;border:none;font:inherit;color:inherit;padding:0}
.jar .glass{position:relative;margin:0 auto;width:84px;height:100px;border:4px solid #6b8fa6;border-top-width:3px;border-radius:12px 12px 22px 22px;background:rgba(220,240,255,.55);overflow:hidden}
.jar .lid{width:64px;height:12px;margin:0 auto -2px;background:var(--wood);border:3px solid var(--woodd);border-radius:4px}
.jar .fill{position:absolute;left:0;right:0;bottom:0;background:repeating-radial-gradient(circle at 30% 30%,#ffe27a 0 5px,#f2c14e 5px 9px);transition:height .4s}
.jar .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Pixelify Sans";font-weight:700;font-size:18px;text-shadow:0 0 4px #fff,0 0 2px #fff}
.ledger{width:100%;border-collapse:collapse;font-size:15px}
.ledger td{padding:7px 6px;border-bottom:1px dashed #d9bb86;vertical-align:top}
.ledger td.amt{text-align:right;font-weight:800;white-space:nowrap}
.ledger .x{background:none;border:none;cursor:pointer;font-size:16px;color:var(--ink2);padding:0 4px}
.harvest{background:linear-gradient(180deg,#ffe9b0,#ffd27a)}

/* self care */
.ptdots{display:flex;gap:10px;margin:8px 0}
.ptdot{width:46px;height:46px;border-radius:50%;border:3px dashed var(--woodd);display:flex;align-items:center;justify-content:center;font-size:24px;background:#fffaf0}
.ptdot.on{border-style:solid;background:var(--pink2)}
.cups{display:flex;gap:6px;flex-wrap:wrap}
.cup{width:38px;height:46px;border:3px solid #6b8fa6;border-top:none;border-radius:0 0 10px 10px;background:#f4fbff;cursor:pointer;position:relative;overflow:hidden;padding:0}
.cup.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:78%;background:linear-gradient(180deg,#a9dcff,#62b6ea)}
.exlist label{display:flex;gap:8px;align-items:center;padding:3px 0}
.exlist input[type=checkbox]{width:20px;height:20px;accent-color:var(--pink)}
.entry{background:#fffaf0;border-left:4px solid var(--pink);padding:7px 10px;margin:6px 0;border-radius:0 8px 8px 0}

/* farmhouse room */
.room{position:relative;width:100%;aspect-ratio:16/10;border:4px solid var(--woodd);border-radius:10px;overflow:hidden;
  background:linear-gradient(180deg,transparent 64%,#6b4226 64%,#6b4226 65.5%,transparent 65.5%),
  repeating-linear-gradient(90deg,#f7dfc0 0 26px,#f2d4ae 26px 52px);font-size:min(5vw,40px)}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:35%;background:repeating-linear-gradient(0deg,#b98352 0 18px,#a7723f 18px 20px)}
.room .it{position:absolute;line-height:1;transform:translate(-50%,-100%);text-align:center}
.room .win{position:absolute;left:5%;top:10%;width:20%;height:34%;border:5px solid #8c5a30;border-radius:6px;background:linear-gradient(180deg,#2d3a6b,#7f6aa8 70%,#f4a6a0);overflow:hidden}
.room .win:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:4px solid #8c5a30}
.room .win:after{content:"";position:absolute;top:50%;left:0;right:0;border-top:4px solid #8c5a30}
.room .win i{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%}
.room .couch{position:absolute;left:60%;top:46%;width:30%;height:22%;background:#e89aa8;border:4px solid #a85a6a;border-radius:18px 18px 8px 8px}
.room .couch:before{content:"";position:absolute;left:-10%;right:-10%;bottom:-4px;height:45%;background:#e48a9c;border:4px solid #a85a6a;border-radius:14px}
.room .quilt{position:absolute;left:62%;top:52%;width:22%;height:16%;border:3px solid #7d5a8a;border-radius:6px;
  background:conic-gradient(#ffd45a 0 25%,#9ed2f2 0 50%,#f39bb8 0 75%,#9fdc7c 0) 0 0/24px 24px;transform:rotate(-4deg)}
.room .table{position:absolute;left:40%;top:70%;width:16%;height:5%;background:#8c5a30;border:3px solid var(--woodd);border-radius:4px}
.room .table:after{content:"";position:absolute;left:12%;right:12%;top:100%;height:110%;border-left:6px solid var(--woodd);border-right:6px solid var(--woodd)}
.room .rug{position:absolute;left:28%;top:78%;width:40%;height:18%;border-radius:50%;background:repeating-radial-gradient(ellipse,#c97a9a 0 8px,#f0b5c8 8px 16px);border:3px solid #a85a6a}
.room .fire{position:absolute;left:30%;top:28%;width:18%;height:37%;background:repeating-linear-gradient(0deg,#b5503c 0 12px,#8f3b2b 12px 14px);border:4px solid #5e2a1d;border-radius:6px 6px 0 0}
.room .fire:before{content:"";position:absolute;left:20%;right:20%;bottom:0;height:55%;background:#2b1a14;border-radius:40% 40% 0 0}
.room .fire span{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);animation:flick 1s infinite alternate}
.room .fire:after{content:"";position:absolute;left:-12%;right:-12%;top:-10px;height:10px;background:#8c5a30;border:3px solid var(--woodd)}
@keyframes flick{to{transform:translateX(-50%) scale(1.08,1.15)}}
.room .lights{position:absolute;left:0;right:0;top:3%;height:8%;display:flex;justify-content:space-around}
.room .lights b{width:12px;height:12px;border-radius:50%;animation:tw 1.6s infinite alternate}
@keyframes tw{from{opacity:.45}to{opacity:1;box-shadow:0 0 12px currentColor}}
.room .beam{position:absolute;left:8%;top:30%;width:28%;height:62%;background:linear-gradient(160deg,rgba(255,236,150,.55),rgba(255,236,150,0));clip-path:polygon(15% 0,55% 0,100% 100%,30% 100%);pointer-events:none}
.room .cushion{position:absolute;left:10%;top:84%;width:16%;height:8%;background:#ffd45a;border:3px solid #c99a2a;border-radius:50%}
.room .glow{filter:drop-shadow(0 0 10px #fff3a0)}
.room canvas.spr{position:absolute;transform:translate(-50%,-100%)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:#fffaf0;border:3px solid var(--woodd);border-radius:10px;padding:10px;text-align:center}
.item .e{font-size:32px}
.item .n{font-weight:900;font-size:14px;line-height:1.25;min-height:36px}
.item.owned{background:var(--green2)}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(40,25,10,.55);display:flex;align-items:center;justify-content:center;padding:14px}
#modal[hidden]{display:none}
#modal .sheet{background:var(--parch);border:4px solid var(--woodd);border-radius:14px;box-shadow:inset 0 0 0 3px var(--edge);padding:18px;width:min(560px,100%);max-height:92vh;overflow:auto;position:relative}
#modal .close{position:absolute;top:8px;right:10px;background:none;border:none;font-size:24px;cursor:pointer;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--woodd);background:#fffaf0;border-radius:99px;padding:5px 11px;cursor:pointer;font-size:15px;color:var(--ink)}
.chip.on{background:var(--pink);font-weight:700}
.amtin{font-family:"Pixelify Sans";font-size:34px;width:100%;text-align:center;padding:8px}

/* onboarding */
.drop{border:3px dashed var(--wood);border-radius:12px;padding:26px;text-align:center;background:#fffaf0;cursor:pointer}
.drop.over{background:var(--pink2)}
.rv{display:grid;grid-template-columns:28px 1fr 140px 110px;gap:6px 8px;align-items:center;padding:8px 6px;border-bottom:1px dashed #d9bb86}
.rv.off{opacity:.5}
.rv input[type=checkbox]{width:20px;height:20px;accent-color:var(--green)}
.rv .meta{grid-column:2/-1;font-size:12.5px;color:var(--ink2);margin-top:-4px}
.rv input[type=text],.rv input[inputmode]{width:100%}
.sticky{position:sticky;bottom:0;background:var(--parch);border-top:3px solid var(--woodd);padding:10px 0 4px;margin-top:8px}
.cat-ed{display:grid;grid-template-columns:1fr 110px 100px 100px 34px;gap:6px;align-items:center;margin:4px 0}
.cat-ed input,.cat-ed select{width:100%;padding:5px 6px;font-size:14px}
@media (max-width:640px){
  h1{font-size:21px}
  .rv{grid-template-columns:26px 1fr 1fr}
  .rv .nmcell{grid-column:2/-1}
  .rv .meta{grid-column:2/-1}
  .cat-ed{grid-template-columns:1fr 1fr 34px}
  .cat-ed .nmc{grid-column:1/-1}
  .tab{font-size:14px;padding:6px 6px}
  .fab{left:16px;right:16px}
  .board{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<button class="btn fab" id="fab" data-act="logBuy" hidden>🌱 Log a purchase</button>
<div id="modal" hidden></div>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script>
"use strict";
/* ================================================================
   Sunbeam Farm: a cozy budget farm for Ashley.
   Everything is saved in this browser (localStorage). Nothing is uploaded.
   ✏️ Personalize: edit AFFIRMATIONS, SEN_GIFTS, LEVEL_CHEERS below.
   ================================================================ */

// Sen's little cheers on level-up (one is picked at random).
const LEVEL_CHEERS = [
  "Sen did a happy loaf on the cushion. That's cat for \"I'm so proud of you.\"",
  "Sen headbutted your hand twice. Big honor.",
  "Sen brought you a level-up toy mouse. It is slightly damp. It is a gift.",
  "Sen is purring so loud Charlie came to check on her.",
  "Sen gave you the slowest, most loving blink. 😽",
  "Charlie did zoomies. Sen pretended not to care, but she watched the whole time.",
  "Leo looked up from the couch and said \"Look at you go!\" Sen agreed."
];

const AFFIRMATIONS = [
  "You are allowed to take up space, even the whole sunbeam.",
  "Progress, not perfection. Sen naps imperfectly and is thriving.",
  "Your worth isn't measured in dollars. Your budget is just a map, and you're the one holding it.",
  "Being gentle with yourself is a skill, and you're getting good at it.",
  "You did hard things before. You can do this one too.",
  "Rest is productive. Ask any cat.",
  "Your body is doing its best for you. Thank it today.",
  "It's okay to start again as many times as you need.",
  "You make the people around you feel safe. That's rare.",
  "Small steps still get you there. Tiny paws, big journeys.",
  "You don't have to earn kindness, especially from yourself.",
  "Every logged purchase is just information, never a judgment.",
  "You are a very good human. Sen has checked.",
  "Today you only need to do the next small thing.",
  "Your future self is cheering for you right now.",
  "You're allowed to be proud of yourself out loud.",
  "Money mistakes are normal. You're learning, and that's the whole point.",
  "You are loved exactly as you are today.",
  "Soft heart, strong hips, steady hands.",
  "Your pace is the right pace.",
  "You deserve the same kindness you give everyone else.",
  "A no-spend day is a gift to future-you. A treat-yourself day can be too.",
  "You are not behind. You're exactly where your story is.",
  "Breathe in, breathe out. The farm will wait for you.",
  "Sen thinks you're the best lap in the house.",
  "You're building something cozy and safe, one coin at a time.",
  "Healing isn't linear, and neither are budgets. Both still move forward.",
  "Drink some water, little plant. You're growing.",
  "You handle more than people know. That's strength.",
  "Today, you're allowed to be a little bit amazing."
];
const SEN_GIFTS = [

  const savPlan = r2(catsOf("savings").reduce((a, c) => a + c.amt, 0));

    budget: r2(spendBud + billBud), spent: r2(spendAct + billPaid), unassigned: r2(incPlan - spendBud - billBud - savPlan)};
}

const RX_MONTH = /\b(january|february|march|april|may|june|july|august|september|sept|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|oct|nov|dec)\b\.?/i;
const MON3 = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const RX_BUD = /budget|planned|\bplan\b|projected|expected|estimate|\bgoal|target|allot|\blimit|amount|\bamt\b|monthly|\bcost\b|\bdue\b/i;
const RX_ACT = /actual|spent|\bpaid\b|\breal\b|so far|to date|\bused\b/i;
const RX_LABELHDR = /^(categor(y|ies)|items?|names?|descriptions?|expenses?|bills?|sources?|accounts?|types?|line items?)$/i;
const RX_TOTAL = /\b(total|totals|subtotal|sub total|balance|remaining|left ?over|difference|\bnet\b|sum|surplus|deficit|cash ?flow|unassigned|left to (spend|budget)|net income)\b/i;
const RX_INC = /income|salary|pay ?check|\bpay\b|wages?|bonus|side hustle|freelance|commission|dividend|interest earned|\btips\b|reimburse|child support received|stipend/i;
const RX_SAV = /saving|emergency|\bfund\b|invest|401 ?k|\bira\b|roth|retire|\bhsa\b|sinking|nest egg|brokerage|\bgoals?\b/i;
const RX_BILL = /rent|mortgage|electric|utilit|water|\bgas bill|sewer|trash|internet|wi-?fi|\bphone|cell|insurance|\bloan|car payment|student|credit card|subscription|netflix|spotify|hulu|disney|hbo|\bmax\b|youtube|apple|amazon prime|prime|gym|membership|\bhoa\b|tuition|daycare|child ?care|cable|streaming|\bpayment\b|\bbills?\b|fixed/i;

function monthOf(v) {
  if (v instanceof Date && !isNaN(v)) return {m: v.getMonth(), y: v.getFullYear()};
  if (typeof v !== "string") return null;
  const s = v.toLowerCase(), mm = s.match(RX_MONTH);
  if (mm) { const y = s.match(/\b(20\d\d)\b/) || s.match(/'(\d\d)\b/); return {m: MON3.indexOf(mm[1].slice(0, 3)), y: y ? (y[1].length === 2 ? 2000 + +y[1] : +y[1]) : null}; }
  const n = s.match(/^\s*(\d{1,2})[\/\-.](\d{2}|\d{4})\s*$/);
  if (n && +n[1] >= 1 && +n[1] <= 12) return {m: +n[1] - 1, y: n[2].length === 2 ? 2000 + +n[2] : +n[2]};
  return null;
}
function guessType(label, section) {
  const L = label, Sx = section || "";
  if (RX_INC.test(L) && !/expense/i.test(L)) return "income";
  if (RX_SAV.test(L)) return "savings";
  if (/income|earning/i.test(Sx)) return "income";
  if (/saving|invest|goal|retire/i.test(Sx)) return "savings";
  if (RX_BILL.test(L)) return "bill";
  if (/bill|fixed|recurring|housing|utilit|debt|insurance|subscription/i.test(Sx)) return "bill";
  return "spending";
}
const isText = v => typeof v === "string" && v.trim() !== "" && num(v) === null;

function parseWorkbook(wb) {
  const now = new Date(), cm = now.getMonth(), cy = now.getFullYear();
  const out = [];
  wb.SheetNames.forEach((sn, sIdx) => {
    const ws = wb.Sheets[sn]; if (!ws || !ws["!ref"]) return;
    const rows = XLSX.utils.sheet_to_json(ws, {header: 1, raw: true, defval: null, blankrows: false});
    const smo = monthOf(sn);
    let prio;
    if (smo && smo.m === cm && (smo.y == null || smo.y === cy)) prio = 100;
    else if (!smo) prio = 70 - sIdx * 0.01;
    else { const back = ((cm - smo.m) + 12) % 12 + ((smo.y && smo.y < cy) ? 12 : 0); prio = 50 - back; }
    let map = null, section = "", prevMonthRow = null;
    const pickMonthCols = cols => {
      // cols: [{i, m, y, act}] -> choose budget/actual column for the current month
      let here = cols.filter(c => c.m === cm && (c.y == null || c.y === cy));
      if (!here.length) {
        const score = c => ((c.y ?? cy) * 12 + c.m);
        const past = cols.filter(c => score(c) <= cy * 12 + cm).sort((a, b) => score(b) - score(a));
        here = past.length ? cols.filter(c => c.m === past[0].m && c.y === past[0].y) : cols.filter(c => c.m === cols[0].m);
      }
      const act = here.find(c => c.act), bud = here.find(c => !c.act);
      return {bud: bud ? bud.i : (act ? act.i : null), act: bud && act ? act.i : null, month: true};
    };
    rows.forEach((row, ri) => {
      if (!row || !row.some(v => v !== null && v !== "")) return;
      // ---- header detection
      let bud = [], act = [], mons = [], nums = 0, textCells = [];
      row.forEach((v, i) => {
        const mo = monthOf(v);
        if (typeof v === "number" && !(v >= 1990 && v <= 2100 && Number.isInteger(v))) nums++;
        if (mo) mons.push({i, m: mo.m, y: mo.y, act: typeof v === "string" && RX_ACT.test(v)});
        else if (typeof v === "string") {
          if (RX_ACT.test(v) && v.length < 40) act.push(i);
          else if (RX_BUD.test(v) && v.length < 40) bud.push(i);
          else if (v.trim()) textCells.push(i);
        }
      });
      const isMonthRow = mons.length >= 2 && nums === 0;
      const isHeader = nums === 0 && (isMonthRow || bud.length + act.length >= 1 && (bud.length + act.length >= 2 || textCells.length <= 2));
      if (isHeader) {
        if (isMonthRow) { map = pickMonthCols(mons); prevMonthRow = row; }
        else if (prevMonthRow && ri > 0) {
          // sub-header beneath a month row: carry months to the right (merged cells)
          let cur = null; const cols = [];
          for (let i = 0; i < Math.max(row.length, prevMonthRow.length); i++) {
            const mo = monthOf(prevMonthRow[i]); if (mo) cur = mo;
            if (cur && (bud.includes(i) || act.includes(i))) cols.push({i, m: cur.m, y: cur.y, act: act.includes(i)});
          }
          map = cols.length ? pickMonthCols(cols) : {bud: bud[0] ?? null, act: act[0] ?? null};
          prevMonthRow = null;
        } else { map = {bud: bud.length ? bud[0] : null, act: act.length ? act[0] : null}; prevMonthRow = null; }
        const lab = textCells.length ? String(row[textCells[0]]).trim() : "";
        if (!lab || RX_LABELHDR.test(lab)) section = /^(expenses?|bills?)$/i.test(lab) ? lab : "";
        else if (!RX_TOTAL.test(lab) && lab.length < 40) section = lab;
        return;
      }
      prevMonthRow = null;
      // ---- data row
      const firstNumCol = (() => { for (let i = 0; i < row.length; i++) if (num(row[i]) !== null && !(row[i] instanceof Date)) return i; return Infinity; })();
      const limit = Math.min(firstNumCol, map && map.bud != null ? map.bud : Infinity, map && map.act != null ? map.act : Infinity);
      let label = null;
      for (let i = 0; i < Math.min(row.length, limit); i++) if (isText(row[i])) { label = String(row[i]).trim(); break; }
      if (!label) return;
      if (RX_LABELHDR.test(label)) return;
      let amt = map && map.bud != null ? num(row[map.bud]) : null;
      let actual = map && map.act != null ? num(row[map.act]) : null;
      const anyNum = row.some(v => num(v) !== null && !(v instanceof Date));
      if (amt === null && actual === null && !anyNum) { if (label.length < 48) section = label; return; }
      if (amt === null && !(map && map.month)) {
        for (let i = 0; i < row.length; i++) { if (map && i === map.act) continue; const n = num(row[i]); if (n !== null && !(row[i] instanceof Date)) { amt = n; break; } }
      }
      amt = Math.abs(amt || 0); actual = actual == null ? null : Math.abs(actual);
      const isTotal = RX_TOTAL.test(label) || RX_TOTAL.test(section) && /total/i.test(section);
      out.push({sheet: sn, prio, label, section, amt: r2(amt), act: actual == null ? null : r2(actual), isTotal});
    });
  });
  // ---- dedupe across sheets, preferring current month's sheet
  const best = {};
  out.forEach(r => { const k = norm(r.label); if (!best[k] || r.prio > best[k].prio) best[k] = {prio: r.prio, sheet: r.sheet}; });
  const seen = {}, rowsOut = [];
  out.forEach(r => {
    const k = norm(r.label); if (!k) return;
    if (best[k].sheet !== r.sheet) return;
    let name = r.label;
    if (seen[k]) { name = r.label + (r.section ? " (" + r.section + ")" : " 2"); }
    seen[k] = true;
    const type = guessType(r.label, r.section);
    rowsOut.push({id: uid(), on: !r.isTotal && r.amt > 0, name, type, amt: r.amt, act: r.act, meta: r.sheet + (r.section ? " · " + r.section : ""), isTotal: r.isTotal});
  });
  return rowsOut;
}

function wireFile(inp, drop) {
  inp.onchange = () => inp.files[0] && readFile(inp.files[0]);
  if (!drop) return;
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) readFile(f); });
}
function readFile(f) {
  const err = m => { const el = $("#obErr"); if (el) el.textContent = m; else toast(m); };
  if (typeof XLSX === "undefined") return err("The spreadsheet reader didn't load. Check your internet connection and refresh. 💛");
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const wb = XLSX.read(new Uint8Array(fr.result), {type: "array", cellDates: true});
      const rows = parseWorkbook(wb);
      if (!rows.length) return err("Hmm, I couldn't find any budget rows in that file. Want to start without a spreadsheet instead?");
      OB.rows = rows; OB.fileName = f.name; OB.step = 3; OB.useActual = false;
      if (S) { OB.mode = "merge"; markMerge(); }
      S ? renderReview() : renderOnboard();
    } catch (e) { console.error(e); err("Sen tried, but that file wouldn't open. Is it an Excel or CSV file?"); }
  };
  fr.readAsArrayBuffer(f);
}
function markMerge() {
  const byName = {}; S.cats.forEach(c => byName[norm(c.name)] = c);
  OB.rows.forEach(r => { const ex = byName[norm(r.name)]; r.ex = ex ? ex.id : null; if (ex) { r.type = ex.type; r.was = ex.amt; } });
}

function delEntry(k, id) {

  confirmBox("Remove this entry? (It just disappears, no penalties.)", "Remove", () => {
    if (k === "tx") m.tx = m.tx.filter(t => t.id !== id);

      ${spr("leo", 4, `style="left:82%;top:93%;width:9%" title="Leo, just hanging out"`)}
      ${has("bone") ? `<div class="it" style="left:67%;top:96%;font-size:.6em">🦴</div>` : ""}
      ${has("lights") ? `<div class="lights">${Array.from({length: 16}, (_, i) => `<b style="background:${lightColors[i % 5]};color:${lightColors[i % 5]};animation-delay:${(i % 4) * .4}s"></b>`).join("")}</div>` : ""}
    </div>
    <p class="muted">${S.owned.length ? "Sen, Charlie and Leo love what you've done with the place." : "Leo, Sen and Charlie are hanging out. It's a little empty… earn ⭐ from quests, gifts and harvests to decorate!"}</p>
  </div>
  <div class="panel"><div class="spread"><h2>🛍️ Sen's Little Shop</h2><div class="starct">⭐ ${S.stars}</div></div>
    <div class="shop">${DECOR.map(it => { const o = S.owned.includes(it.id); return `<div class="item ${o ? "owned" : ""}"><div class="e">${it.e}</div><div class="n">${esc(it.n)}</div><div class="muted" style="font-size:12.5px">${esc(it.d)}</div>
      ${o ? `<button class="btn sm white" data-act="hide" data-id="${it.id}">${S.hidden.includes(it.id) ? "Put out" : "Put away"}</button>` : `<button class="btn sm" data-act="buy" data-id="${it.id}" ${S.stars < it.c ? "disabled" : ""}>⭐ ${it.c}</button>`}</div>`; }).join("")}</div></div>`;
}

/* ---------------- SETTINGS ---------------- */
function vSettings() {
  const groups = ["income", "bill", "spending", "savings"];
  const lbl = {income: "💰 Income", bill: "📋 Bills", spending: "🌱 Spending crops", savings: "🫙 Savings jars"};
  return `<div class="panel"><h2>🧑‍🌾 Farmer</h2>
    <div class="row"><label>Name <input id="stName" value="${esc(S.name)}"></label><label>Farm <input id="stFarm" value="${esc(S.farm)}"></label><button class="btn sm" data-act="stSave">Save</button></div></div>
  <div class="panel"><h2>📄 Newer spreadsheet?</h2><p class="muted">Upload it and I'll update budgets for categories with the same name, and offer to add any new ones. Your logged purchases stay put.</p>
    <label class="btn blue" style="display:inline-block">Upload spreadsheet<input type="file" id="reFile" accept=".xlsx,.xls,.xlsm,.csv,.ods" hidden></label></div>
  <div class="panel"><h2>🗂️ Categories</h2><p class="muted">Monthly amounts. Changes save as you go. Savings jars can have a total goal.</p>
    ${groups.map(g => `<h3>${lbl[g]}</h3>${catsOf(g).map(c => `<div class="cat-ed" data-id="${c.id}">
      <input class="nmc" data-f="name" value="${esc(c.name)}" aria-label="Name">
      <select data-f="type" aria-label="Type">${groups.map(t => `<option value="${t}" ${t === c.type ? "selected" : ""}>${t}</option>`).join("")}</select>
      <input data-f="amt" inputmode="decimal" value="${c.amt}" aria-label="Monthly amount">
      ${c.type === "savings" ? `<input data-f="goal" inputmode="decimal" value="${c.goal || ""}" placeholder="goal" aria-label="Goal">` : "<span></span>"}
      <button class="btn sm white" data-act="catDel" data-id="${c.id}" aria-label="Delete ${esc(c.name)}">✕</button></div>`).join("") || `<p class="muted">None yet.</p>`}
      <button class="btn sm white" data-act="catAdd" data-t="${g}">+ Add</button>`).join("")}
  </div>
  <div class="panel"><div class="row">${spr("charlie", 4)}<div style="flex:1"><h2>🦴 Charlie's backup bones</h2>
    <p class="muted">Charlie buries a save file on your device. If this browser ever forgets your farm, dig it back up! ${S.lastBackup ? "Last bone buried " + dLabel(S.lastBackup) + "." : "No bones buried yet."}</p></div></div>
    <div class="row"><button class="btn" data-act="backup">🦴 Bury a bone (download)</button><label class="btn white" style="display:inline-block">⛏️ Dig up a bone<input type="file" id="restore" accept=".json,application/json" hidden></label></div></div>
  <div class="panel"><h2>🌧️ Start over</h2><p class="muted">Clears the whole farm from this browser. Bury a bone first if you might want it back.</p><button class="btn white" data-act="reset">Reset farm</button></div>`;
}

/* ---------------- actions ---------------- */
const ACT = {
  close: () => closeModal(),
  ob1: () => { OB.step = 1; renderOnboard(); },
  ob2: () => { OB.name = $("#obName").value.trim() || "Ashley"; OB.farm = $("#obFarm").value.trim() || "Sunbeam Farm"; OB.step = 2; renderOnboard(); },
  ob2back: () => { OB.step = 2; renderOnboard(); },
  obNoSheet: () => { OB.rows = DEFAULT_CATS.map(([n, t]) => ({id: uid(), on: true, name: n, type: t, amt: 0, act: null, meta: "starter category"})); OB.fileName = ""; OB.mode = "new"; OB.step = 3; renderOnboard(); },
  rvAll: () => { OB.rows.forEach(r => r.on = true); renderReview(); },
  rvNone: () => { OB.rows.forEach(r => r.on = false); renderReview(); },
  rvAdd: () => { OB.rows.push({id: uid(), on: true, name: "New category", type: "spending", amt: 0, act: null, meta: "added by you"}); renderReview(); setTimeout(() => { const l = [...document.querySelectorAll(".rv input[type=text]")].pop(); l && (l.focus(), l.select()); }, 30); },
  plant: () => plantFarm(),
  rvCancel: () => { OB = {step: 1, rows: []}; tab = "settings"; render(); },
  rvMerge: () => {
    let up = 0, add = 0;
    OB.rows.filter(r => r.on && String(r.name).trim()).forEach(r => {
      const ex = r.ex && cat(r.ex);
      if (ex) { ex.amt = r2(r.amt); ex.type = r.type; up++; } else { S.cats.push({id: uid(), name: String(r.name).trim(), type: r.type, amt: r2(r.amt), goal: 0}); add++; }
    });
    OB = {step: 1, rows: []}; tab = "farm"; toast(`Farm updated! ${up} budgets refreshed, ${add} new ${add === 1 ? "category" : "categories"} 🌾`); commit();
  },
  tab: d => { tab = d.t; if (tab === "farm") viewMK = viewMK || curMK(); render(); scrollTo({top: 0}); },
  gotoCare: () => { tab = "care"; render(); scrollTo({top: 0}); },
  logBuy: () => logBuy(),
  noSpend: () => noSpend(),
  ship: () => ship(),
  jar: d => jar(d.id),
  crop: d => cropDetail(d.id),
  bill: (d, el) => toggleBill(d.id, el),
  harvest: () => harvest(),
  del: d => delEntry(d.k, d.id),
  mon: d => { viewMK = d.k === "0" ? curMK() : shiftMK(viewMK, +d.k); render(); },
  gift: () => {
    const d = D(); if (d.gift) return;
    d.gift = pick(SEN_GIFTS); d.giftStars = 1 + Math.floor(Math.random() * 3); addStars(d.giftStars); addXP(5);
    modal(`<div class="sen">${spr("sen", 5)}<div class="bubble">Mrrrp! I brought you <b>${esc(d.gift)}</b>. Also ${d.giftStars} ⭐. You're welcome. 🐾</div></div><p style="text-align:right;margin-top:12px"><button class="btn pink" data-act="close">Thank you, Sen! 💕</button></p>`);
    save(); render();
  },
  questBonus: () => {
    const qs = questState(), d = D(); if (!qs.all || d.questBonus) return;
    d.questBonus = true; const g = pick(SEN_GIFTS); addXP(30); addStars(3);
    modal(`<h2>🎉 All quests done!</h2><div class="sen">${spr("sen", 4)}<div class="bubble">You did all three! I'm giving you my best treasure: <b>${esc(g)}</b>. Plus 3 ⭐ and 30 XP. 💕</div></div><p style="text-align:right;margin-top:12px"><button class="btn pink" data-act="close">Yay!</button></p>`);
    save(); render();
  },
  kindNote: () => kindNote(),
  ptLog: () => ptLog(), ptRest: () => ptRest(),
  ptDel: d => { S.pt.log = S.pt.log.filter(p => p.id !== d.id); commit(); },
  exAdd: () => { const v = $("#exNew").value.trim(); if (!v) return; S.pt.exercises.push(v); commit(); },
  exDel: d => { S.pt.exercises.splice(+d.i, 1); commit(); },
  water: d => water(+d.i),
  kindSave: () => kindSave($("#kindTxt").value),
  jDel: d => confirmBox("Remove this kind note? (It's still true, though.)", "Remove", () => { S.journal = S.journal.filter(j => j.id !== d.id); commit(); }),
  buy: d => {
    const it = DECOR.find(x => x.id === d.id); if (!it || S.stars < it.c || S.owned.includes(it.id)) return;
    S.stars -= it.c; S.owned.push(it.id); toast(`${it.e} ${esc(it.n)} is in the farmhouse now!`); commit();
  },
  hide: d => { S.hidden = S.hidden.includes(d.id) ? S.hidden.filter(x => x !== d.id) : [...S.hidden, d.id]; commit(); },
  stSave: () => { S.name = $("#stName").value.trim() || S.name; S.farm = $("#stFarm").value.trim() || S.farm; toast("Saved 🌱"); commit(); },
  catAdd: d => { S.cats.push({id: uid(), name: "New " + {income: "income", bill: "bill", spending: "crop", savings: "jar"}[d.t], type: d.t, amt: 0, goal: 0}); commit(); },
  catDel: d => { const c = cat(d.id); confirmBox(`Delete <b>${esc(c.name)}</b>? Past entries stay in your ledger.`, "Delete", () => { S.cats = S.cats.filter(x => x.id !== d.id); commit(); }); },
  backup: () => {
    const blob = new Blob([JSON.stringify(S, null, 1)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "sunbeam-farm-bone-" + today() + ".json";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    S.lastBackup = today(); toast("Charlie buried a bone! 🦴 (It's in your downloads.)"); commit();
  },
  reset: () => confirmBox("Really clear the whole farm from this browser? This can't be undone unless you have a backup bone.", "Clear it", () => {
    try { localStorage.removeItem(KEY); } catch (e) {}
    S = null; OB = {step: 1, rows: []}; render();
  })
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.tagName === "INPUT" && b.type === "checkbox") { ACT[b.dataset.act]?.(b.dataset, b); return; }
  e.preventDefault(); ACT[b.dataset.act]?.(b.dataset, b);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "reFile" && el.files[0]) return readFile(el.files[0]);
  if (el.id === "restore" && el.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try { const d = JSON.parse(fr.result); if (!d || !Array.isArray(d.cats) || !d.months) throw 0;
        confirmBox("Dig up this bone and replace the current farm with it?", "Dig it up", () => { S = d; S.pendingLevels ||= []; S.hidden ||= []; save(); toast("Charlie found it! Farm restored 🦴✨"); render(); });
      } catch (x) { toast("That doesn't look like one of Charlie's bones 🤔"); }
    };
    fr.readAsText(el.files[0]); return;
  }
  const row = el.closest(".cat-ed");
  if (row && el.dataset.f) {
    const c = cat(row.dataset.id); if (!c) return;
    const f = el.dataset.f;
    if (f === "amt" || f === "goal") c[f] = r2(Math.abs(num(el.value) || 0));
    else if (f === "name") c.name = el.value.trim() || c.name;
    else c[f] = el.value;
    save(); if (f === "type") render();
  }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "exNew") ACT.exAdd();
  if (e.target.id === "obFarm" || e.target.id === "obName") ACT.ob2();
});

/* ---------------- boot ---------------- */
function boot() {
  if (!S) { render(); return; }
  S.pendingLevels ||= []; S.hidden ||= []; S.pt ||= {log: [], exercises: DEFAULT_EXERCISES.slice()};
  const t = today(), away = S.lastSeen ? daysBetween(S.lastSeen, t) : 0;
  if (S.lastSeen !== t) { S.visits = (S.visits || 0) + 1; }
  S.lastSeen = t; save(); render();
  if (away >= 3) {
    addStars(3); save(); render();
    modal(`<div class="sen">${spr("sen", 5)}<div class="bubble">${esc(S.name)}! You're back! 💕 I kept your sunbeam warm the whole time. There's nothing to catch up on, no streaks to fix, nothing wilted. The farm just waited for you.</div></div>
      <div class="row" style="margin-top:12px">${spr("charlie", 4)}<p style="flex:1">Charlie guarded the bones and wants you to have <b>3 ⭐</b> for coming home. Just start with today. 🌱</p></div>
      <p style="text-align:right"><button class="btn green" data-act="close">Hi Sen, hi Charlie! 🐾</button></p>`);
  } else flush();
}
boot();
</script>
<script data-goatcounter="https://bailsformed.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
